{{ define "main" }}
    <h1 class="title">{{ .Title }}</h1>
    <div class="archive">
      {{ range .Pages.GroupByDate "2006" }}
      <h2 class="year">{{ .Key }}</h2>
      <div class="posts">
        {{ range .Pages }}
        <a class="post-row" href="{{ .RelPermalink }}">
          <span class="post-date">{{ .Date.Format "Jan 2" }}</span>
          <span class="post-title">{{ .Title }}</span>
          <span class="post-tag">{{ with .Params.tags }}{{ index . 0 }}{{ end }}</span>
        </a>
        {{ end }}
      </div>
      {{ end }}
    </div>
{{ end }}
