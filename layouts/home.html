{{ define "main" }}
    <section class="hero">
      <p class="meta"><span class="marker"></span>{{ site.Params.author }} · {{ .Params.tagline }}</p>
      {{ partial "tearout.html" . }}
    </section>

    {{- $paginator := .Paginate (where site.RegularPages "Section" "in" (slice "posts" "notes")) 12 }}
    {{ partial "stream.html" $paginator.Pages }}
    {{ partial "pager.html" . }}
{{ end }}
