# Merged over hugo.toml by `just og` (hugo --config hugo.toml,tools/ogcard/og.toml).
# Adds the "og" output format, which renders the home page and every post a
# second time as a 1200x630 card page for tools/ogcard/render.py to
# screenshot, plus a JSON manifest listing them. None of this is part of the
# production build.

[outputFormats.og]
mediaType = "text/html"
baseName = "og"
isHTML = true
notAlternative = true

[outputFormats.ogmanifest]
mediaType = "application/json"
baseName = "og-manifest"
notAlternative = true

[outputs]
home = ["html", "rss", "og", "ogmanifest"]

[[cascade]]
outputs = ["html", "og"]
[cascade._target]
path = "/posts/**"
